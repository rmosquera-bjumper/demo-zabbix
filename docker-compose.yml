networks:
  zabbix-net:
    driver: bridge

volumes:
  postgres-data:

services:

  # ─────────────────────────────────────────
  # Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zabbix-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Zabbix Server
  # ─────────────────────────────────────────
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zabbix-server
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ZBX_STARTPINGERS: 5
      ZBX_TIMEOUT: 10
      # Connector workers for real-time streaming (StartConnectors).
      # Must be >= the connector's concurrent sessions (1 in this lab).
      ZBX_STARTCONNECTORS: ${ZBX_STARTCONNECTORS:-1}
      # Seconds between configuration cache reloads (picks up connector changes).
      ZBX_CACHEUPDATEFREQUENCY: ${ZBX_CACHEUPDATEFREQUENCY:-10}
    extra_hosts:
      # Lets the server reach apps on the Docker host on Linux; no-op on Docker Desktop.
      - "host.docker.internal:host-gateway"
    ports:
      - "10051:10051"
    networks:
      - zabbix-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Zabbix Web UI
  # ─────────────────────────────────────────
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zabbix-web
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    env_file: .env
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PHP_TZ: Asia/Tokyo
    ports:
      - "8080:8080"
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8080/api_jsonrpc.php -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"apiinfo.version\",\"params\":[],\"id\":1}' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Zabbix Agent on Zabbix Server itself
  # ─────────────────────────────────────────
  zabbix-agent-server:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zabbix-agent-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: Zabbix-Server
    networks:
      - zabbix-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Test Linux Server 1
  # ─────────────────────────────────────────
  test-linux-1:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: test-linux-1
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: test-linux-1
    networks:
      - zabbix-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Test Linux Server 2
  # ─────────────────────────────────────────
  test-linux-2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: test-linux-2
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: test-linux-2
    networks:
      - zabbix-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Test Web Server (Nginx + Zabbix Agent)
  # ─────────────────────────────────────────
  test-web-server:
    build: ./test-servers/web
    container_name: test-web-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: test-web-server
    ports:
      - "8081:80"
    networks:
      - zabbix-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Init: API経由でテストホストを自動登録
  # ─────────────────────────────────────────
  zabbix-init:
    image: alpine:3.19
    container_name: zabbix-init
    depends_on:
      zabbix-web:
        condition: service_healthy
    environment:
      # Read only by init/setup-streaming.sh, which translates them into a
      # Zabbix connector through the API. Zabbix itself never reads them.
      STREAMING_ENABLED: ${STREAMING_ENABLED:-false}
      STREAMING_URL: ${STREAMING_URL:-}
      STREAMING_BEARER_TOKEN: ${STREAMING_BEARER_TOKEN:-}
      ZBX_CACHEUPDATEFREQUENCY: ${ZBX_CACHEUPDATEFREQUENCY:-10}
    volumes:
      - ./init:/init:ro
    command: sh -c "sh /init/setup-hosts.sh && sh /init/setup-streaming.sh"
    networks:
      - zabbix-net
    restart: "no"

  # ─────────────────────────────────────────
  # Sensor simulator: pushes temperature, voltage and humidity
  # for 5 simulated hosts to Zabbix trapper items (zabbix_sender).
  # Talks to zabbix-server only, never to the stream receiver.
  # ─────────────────────────────────────────
  sensor-simulator:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: sensor-simulator
    depends_on:
      zabbix-init:
        condition: service_completed_successfully
    environment:
      ZABBIX_SERVER: zabbix-server
      SIM_INTERVAL: ${SIM_INTERVAL:-10}
    volumes:
      - ./simulator:/simulator:ro
    entrypoint: ["sh", "/simulator/simulate.sh"]
    networks:
      - zabbix-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Diagnostic stream receiver (profile: streaming-test)
  # Receives Zabbix native NDJSON streaming and logs each metric.
  # ─────────────────────────────────────────
  stream-receiver:
    build: ./test-servers/stream-receiver
    container_name: stream-receiver
    profiles: ["streaming-test"]
    environment:
      RECEIVER_PORT: 8090
      RECEIVER_EXPECTED_TOKEN: ${STREAMING_BEARER_TOKEN:-}
      RECEIVER_LOG_RAW: ${RECEIVER_LOG_RAW:-false}
    ports:
      - "8090:8090"
    networks:
      - zabbix-net
    restart: unless-stopped
